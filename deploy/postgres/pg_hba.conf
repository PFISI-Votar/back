# VOTAR-498 — pg_hba.conf de PRODUCCIÓN.
#
# Mitiga: unguarded-direct-datastore-access. Única vía de entrada por red: TLS
# obligatorio (hostssl) + `scram-sha-256` desde el CIDR del backend NestJS.
# Cualquier otro origen, o el mismo origen sin TLS, es rechazado.
#
# No se exige `clientcert=verify-ca`: `DB_SSL_CERT`/`DB_SSL_KEY` son mTLS
# opcional en el backend (ver `src/config/database-ssl.config.ts` y Joi en
# `src/config/env.validation.ts`, que no los requiere en producción). Exigir
# certificado de cliente acá sin que el backend lo mande por defecto dejaría
# la conexión rota out-of-the-box. Si se adopta mTLS de punta a punta más
# adelante, este archivo, Joi y el checklist de despliegue deben cambiar
# juntos.
#
# Reemplazar antes de desplegar:
#   <DB_NAME>            -> nombre real de la base (ver DB_NAME en .env)
#   <DB_APP_USER>         -> usuario de aplicación del backend (ver DB_USERNAME)
#   <BACKEND_CIDR>        -> IP/CIDR del host o subred donde corre NestJS
#                            (p. ej. 10.0.1.0/24, o /32 para un único host)
#
# TYPE      DATABASE       USER            ADDRESS           METHOD
hostssl     <DB_NAME>      <DB_APP_USER>   <BACKEND_CIDR>    scram-sha-256

# Conexión por socket Unix (mantenimiento/admin desde el propio host, sin
# abrir TCP): solo el superusuario del sistema operativo, autenticado por el
# usuario del SO (`peer`). Ajustar el nombre de rol si el superusuario de
# PostgreSQL no es `postgres`.
local       all            postgres                          peer

# Todo lo demás: rechazado explícitamente (defensa en profundidad — sin estas
# líneas, PostgreSQL igual rechazaría por no matchear ninguna regla, pero un
# reject explícito dificulta que un cambio futuro abra el acceso sin darse
# cuenta de esta política).
local       all            all                                reject
hostnossl   all            all             all               reject
host        all            all             all               reject
