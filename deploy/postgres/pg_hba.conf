# VOTAR-498 — pg_hba.conf de PRODUCCIÓN.
#
# Mitiga: unguarded-direct-datastore-access. Única vía de entrada: TLS
# obligatorio (hostssl) + certificado de cliente válido (clientcert=verify-ca)
# desde el CIDR del backend NestJS. Cualquier otro origen, o el mismo origen
# sin TLS, es rechazado.
#
# Reemplazar antes de desplegar:
#   <DB_NAME>            -> nombre real de la base (ver DB_NAME en .env)
#   <DB_APP_USER>         -> usuario de aplicación del backend (ver DB_USERNAME)
#   <BACKEND_CIDR>        -> IP/CIDR del host o subred donde corre NestJS
#                            (p. ej. 10.0.1.0/24, o /32 para un único host)
#
# TYPE      DATABASE       USER            ADDRESS           METHOD          OPTIONS
hostssl     <DB_NAME>      <DB_APP_USER>   <BACKEND_CIDR>    scram-sha-256   clientcert=verify-ca

# Todo lo demás: rechazado explícitamente (defensa en profundidad — sin estas
# líneas, PostgreSQL igual rechazaría por no matchear ninguna regla, pero un
# reject explícito dificulta que un cambio futuro abra el acceso sin darse
# cuenta de esta política).
hostnossl   all            all             all               reject
host        all            all             all               reject
