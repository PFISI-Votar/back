# VOTAR-498 — pg_hba.conf de DESARROLLO (docker-compose.db-tls.yml).
#
# Igual que pg_hba.conf de producción pero sin exigir certificado de cliente
# (clientcert=verify-ca): así el equipo no necesita emitir/rotar certificados
# de cliente para levantar el stack local. TLS del canal (hostssl +
# scram-sha-256) sigue siendo obligatorio — un intento de conexión con
# PGSSLMODE=disable debe ser rechazado igual que en producción.
#
# TYPE      DATABASE   USER     ADDRESS       METHOD
hostssl     all        all      all           scram-sha-256

hostnossl   all        all      all           reject
host        all        all      all           reject
