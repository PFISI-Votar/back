# VOTAR-498 — hardening de PostgreSQL 16 (fragmento a incluir, no un
# postgresql.conf completo). Combinar con `include_dir` o pasar cada línea
# como `-c clave=valor` al arrancar el contenedor (ver docker-compose.db-tls.yml
# y README.md de esta carpeta).
#
# Mitiga: unencrypted-communication (TLS), unguarded-direct-datastore-access
# (visibilidad de conexiones para poder auditar accesos directos).

# --- TLS ---
ssl = on
ssl_cert_file = '/etc/postgresql/certs/server.crt'
ssl_key_file = '/etc/postgresql/certs/server.key'
ssl_ca_file = '/etc/postgresql/certs/ca.crt'
# TLS 1.2 como piso; PostgreSQL 16 soporta 1.3 y lo preferirá si el cliente lo ofrece.
ssl_min_protocol_version = 'TLSv1.2'

# --- Autenticación ---
# scram-sha-256 en vez de md5: evita exponer un hash reversible por captura
# de tráfico o robo del catálogo pg_authid.
password_encryption = 'scram-sha-256'

# --- Auditoría de conexiones (soporta detectar accesos directos no
# autorizados a nivel de aplicación, ya bloqueados por pg_hba.conf) ---
log_connections = on
log_disconnections = on
